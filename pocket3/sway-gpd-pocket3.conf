### GPD Pocket 3 --- included from ~/.config/sway/config

# The panel is physically portrait (1200x1920) mounted sideways.
# transform 90 == xrandr "--rotate right", which is what upstream uses.
# scale 1.5 turns 1920x1200 into an effective 1280x800 -- readable on 8".
#
# IF THE SCREEN COMES UP UPSIDE DOWN: change 90 to 270 and reload (Mod+Shift+c).
# That is the only value you should ever need to touch here.
output DSI-1 transform 90 scale 1.5

# Bind touch and stylus to the panel so they rotate WITH it.
# Without this the touch input stays in portrait and every tap lands wrong.
input type:touch    map_to_output DSI-1
input type:tablet_tool map_to_output DSI-1

# Touchpad: tap-to-click and natural scroll, as on the daily driver.
input type:touchpad {
    tap enabled
    natural_scroll enabled
    dwt enabled
}
