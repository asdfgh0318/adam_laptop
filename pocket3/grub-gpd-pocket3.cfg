# /etc/default/grub.d/gpd-pocket3.cfg
# fbcon=rotate:1        rotate the boot/tty console 90deg clockwise
# panel_orientation     tell DRM the DSI panel is physically rotated
# mem_sleep_default     s2idle is the only suspend mode that works reliably here
GRUB_CMDLINE_LINUX="${GRUB_CMDLINE_LINUX} fbcon=rotate:1 video=DSI-1:panel_orientation=right_side_up mem_sleep_default=s2idle"
GRUB_GFXMODE=1200x1920x32
